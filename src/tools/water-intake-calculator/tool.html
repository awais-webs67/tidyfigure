<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="Units"><label><input type="radio" name="units" id="u-metric" value="metric" checked><span>Metric (cm, kg)</span></label><label><input type="radio" name="units" id="u-imp" value="imperial"><span>US / Imperial (ft, lb)</span></label></div>
<div class="fields"><label class="f"><span>Sex</span><select id="sex"><option value="f" selected>Female</option><option value="m">Male</option></select></label></div>
<div class="fields" data-units="metric"><label class="f"><span>Weight (kg)</span><input type="number" id="kg" inputmode="decimal" min="25" max="300" step="any" value="68"></label></div>
<div class="fields" data-units="imperial" hidden><label class="f"><span>Weight (lb)</span><input type="number" id="lb" inputmode="decimal" min="55" max="660" step="any" value="150"></label></div>

    <div class="fields">
      <label class="f"><span>Exercise per day (minutes)</span><input type="number" id="ex" inputmode="numeric" min="0" max="600" step="5" value="30"></label>
      <label class="f"><span>Climate</span><select id="hot"><option value="0" selected>Mild</option><option value="500">Hot or humid</option></select></label>
      <label class="f"><span>Status</span><select id="extra"><option value="0" selected>Neither</option><option value="300">Pregnant</option><option value="700">Breastfeeding</option></select></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
