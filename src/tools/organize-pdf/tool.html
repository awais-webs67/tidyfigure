<div class="inputs">
  <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a PDF">
    {{icon:file-up}}
    <strong>Drop a PDF here or click to choose</strong>
    <span id="loaded">Drag pages or use the arrows to reorder; rotate or remove any page</span>
    <input type="file" id="file" accept="application/pdf,.pdf">
  </div>
  <div class="toolbar" id="bar" hidden><button type="button" class="btn ghost" id="reset">Reset order</button><button type="button" class="btn" id="save">{{icon:download}}Save organised PDF</button></div>
  <ul class="pgrid" id="grid"></ul>
  <div class="out" id="out" aria-live="polite">
    <p class="empty">Choose a PDF to see its pages.</p>
    <button type="button" class="btn ghost" id="sample">Try with a sample PDF</button>
  </div>
</div>
