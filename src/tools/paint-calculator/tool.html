<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="Units">
      <label><input type="radio" name="u" value="m" checked><span>Metres &amp; litres</span></label>
      <label><input type="radio" name="u" value="ft"><span>Feet &amp; gallons</span></label>
    </div>
    <div class="fields">
      <label class="f"><span>Room length <i class="ul">(m)</i></span><input type="number" id="len" inputmode="decimal" min="0" step="any" value="4"></label>
      <label class="f"><span>Room width <i class="ul">(m)</i></span><input type="number" id="wid" inputmode="decimal" min="0" step="any" value="3.5"></label>
      <label class="f"><span>Wall height <i class="ul">(m)</i></span><input type="number" id="hgt" inputmode="decimal" min="0" step="any" value="2.5"></label>
    </div>
    <div class="fields">
      <label class="f"><span>Doors</span><input type="number" id="doors" inputmode="numeric" min="0" step="1" value="1"></label>
      <label class="f"><span>Windows</span><input type="number" id="wins" inputmode="numeric" min="0" step="1" value="2"></label>
      <label class="f"><span>Coats</span><select id="coats"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label class="f"><span>Coverage <i class="cl">(m² per litre)</i></span><input type="number" id="cov" inputmode="decimal" min="1" step="any" value="10"></label>
    </div>
    <div class="fields">
      <label class="check"><input type="checkbox" id="ceil">Paint the ceiling too</label>
      <label class="check"><input type="checkbox" id="extra" checked>Add 10% extra</label>
    </div>
    <p class="note">Coverage is printed on the tin. Typical emulsion covers 10–14 m² per litre (350–400 sq ft per gallon) on smooth walls; rough or porous walls take more.</p>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
