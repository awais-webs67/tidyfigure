<div class="tool-grid">
  <div class="inputs">
    <p class="group-title">Assessments (leave the score empty if you haven’t had it yet)</p>
    <div class="list" id="items"></div>
    <button type="button" class="add" id="add-item">+ Add an assessment</button>
    <div class="fields">
      <label class="f"><span>Grade you want overall (%)</span><input type="number" id="target" inputmode="decimal" min="0" max="100" step="any" value="85"></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
