<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="Units"><label><input type="radio" name="units" id="u-metric" value="metric" checked><span>Metric (cm, kg)</span></label><label><input type="radio" name="units" id="u-imp" value="imperial"><span>US / Imperial (ft, lb)</span></label></div>
<div class="fields"><label class="f"><span>Sex</span><select id="sex"><option value="f" selected>Female</option><option value="m">Male</option></select></label><label class="f"><span>Age</span><input type="number" id="age" inputmode="numeric" min="15" max="100" step="1" value="32"></label></div>
<div class="fields" data-units="metric"><label class="f"><span>Height (cm)</span><input type="number" id="cm" inputmode="decimal" min="100" max="250" step="any" value="168"></label><label class="f"><span>Weight (kg)</span><input type="number" id="kg" inputmode="decimal" min="25" max="300" step="any" value="68"></label></div>
<div class="fields" data-units="imperial" hidden><label class="f"><span>Height (ft)</span><input type="number" id="ft" inputmode="numeric" min="3" max="8" step="1" value="5"></label><label class="f"><span>(in)</span><input type="number" id="in" inputmode="decimal" min="0" max="11.9" step="any" value="6"></label><label class="f"><span>Weight (lb)</span><input type="number" id="lb" inputmode="decimal" min="55" max="660" step="any" value="150"></label></div>

    <label class="f"><span>Activity level</span><select id="act"><option value="1.2">Sedentary (desk job, little exercise)</option><option value="1.375">Lightly active (exercise 1–3 days a week)</option><option value="1.55" selected>Moderately active (3–5 days a week)</option><option value="1.725">Very active (6–7 days a week)</option><option value="1.9">Extremely active (physical job + training)</option></select></label>
    <div class="fields">
      <label class="f"><span>Goal</span><select id="goal"><option value="-500" selected>Lose fat</option><option value="0">Maintain</option><option value="300">Build muscle</option></select></label>
      <label class="f"><span>Diet style</span><select id="style"><option value="bal" selected>Balanced</option><option value="hp">High protein</option><option value="lc">Low carb</option><option value="keto">Keto</option></select></label>
      <label class="f"><span>Meals per day</span><select id="meals"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
    </div>
    <label class="f"><span>Or use your own daily calories (optional)</span><input type="number" id="own" inputmode="numeric" min="800" max="6000" step="10" placeholder="e.g. 2000"></label>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
