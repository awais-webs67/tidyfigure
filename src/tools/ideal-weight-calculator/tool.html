<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="Units"><label><input type="radio" name="units" id="u-metric" value="metric" checked><span>Metric (cm, kg)</span></label><label><input type="radio" name="units" id="u-imp" value="imperial"><span>US / Imperial (ft, lb)</span></label></div>
<div class="fields"><label class="f"><span>Sex</span><select id="sex"><option value="f" selected>Female</option><option value="m">Male</option></select></label></div>
<div class="fields" data-units="metric"><label class="f"><span>Height (cm)</span><input type="number" id="cm" inputmode="decimal" min="100" max="250" step="any" value="168"></label></div>
<div class="fields" data-units="imperial" hidden><label class="f"><span>Height (ft)</span><input type="number" id="ft" inputmode="numeric" min="3" max="8" step="1" value="5"></label><label class="f"><span>(in)</span><input type="number" id="in" inputmode="decimal" min="0" max="11.9" step="any" value="6"></label></div>

    <p class="note">Ideal-weight formulas were designed for adults between about 152 cm (5 ft) and 213 cm (7 ft).</p>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
