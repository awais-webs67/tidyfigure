<div class="tool-grid">
  <div class="inputs">
    <div class="fields">
      <label class="f"><span>Income you want to keep (per year, after tax)</span><input type="number" id="want" inputmode="decimal" min="0" step="any" value="60000"></label>
      <label class="f"><span>Business costs (per year)</span><input type="number" id="costs" inputmode="decimal" min="0" step="any" value="6000"></label>
      <label class="f"><span>Tax + social contributions (%)</span><input type="number" id="tax" inputmode="decimal" min="0" max="90" step="any" value="25"></label>
    </div>
    <div class="fields">
      <label class="f"><span>Weeks off (holiday, sick, training)</span><input type="number" id="off" inputmode="decimal" min="0" max="51" step="1" value="7"></label>
      <label class="f"><span>Days per week</span><input type="number" id="days" inputmode="decimal" min="1" max="7" step="0.5" value="5"></label>
      <label class="f"><span>Hours per day</span><input type="number" id="hours" inputmode="decimal" min="1" max="16" step="0.5" value="8"></label>
      <label class="f"><span>Billable time (%)</span><input type="number" id="bill" inputmode="decimal" min="5" max="100" step="5" value="65"></label>
    </div>
    <p class="note">Billable time is the share of your working hours you can charge for. The rest goes on admin, finding clients, invoicing and learning. 50–75% is typical.</p>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
