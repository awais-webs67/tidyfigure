<style>
  .coin-stage { perspective: 900px; display: grid; place-items: center; padding: 18px 0 6px; }
  .coin { width: 190px; height: 190px; position: relative; transform-style: preserve-3d; transition: transform 1.6s cubic-bezier(.2, .7, .2, 1); cursor: pointer; }
  .coin .face { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; backface-visibility: hidden; font: 700 30px/1 var(--f-display); letter-spacing: .04em; color: #4a3500;
    background: radial-gradient(circle at 35% 30%, #fff3c4 0%, #f2c94c 38%, #c99a1c 75%, #a77b0f 100%); box-shadow: inset 0 0 0 10px rgba(255, 255, 255, .25), inset 0 0 0 13px rgba(120, 85, 0, .35), 0 14px 30px -12px rgba(0, 0, 0, .45); }
  .coin .tails { transform: rotateY(180deg); background: radial-gradient(circle at 35% 30%, #f5f7fa 0%, #cfd6e0 40%, #9aa6b5 80%, #7d8898 100%); color: #2b3442; }
  @media (prefers-reduced-motion: reduce) { .coin { transition: none; } }
</style>
<div class="tool-grid">
  <div class="out" style="align-items:center">
    <div class="coin-stage"><div class="coin" id="coin" role="img" aria-label="Coin"><div class="face heads">HEADS</div><div class="face tails">TAILS</div></div></div>
    <p class="big" id="result" style="text-align:center" aria-live="polite">Tap to flip</p>
    <div class="btns" style="justify-content:center">
      <button type="button" class="btn big-btn" id="flip">{{icon:coins}}Flip the coin</button>
      <button type="button" class="btn ghost" id="flip10">Flip 10 times</button>
      <button type="button" class="btn ghost" id="flip100">Flip 100 times</button>
    </div>
  </div>
  <div class="inputs">
    <p class="group-title">Your flips</p>
    <div class="statgrid" id="stats"></div>
    <div class="copybox" id="history" style="min-height:60px"></div>
    <button type="button" class="btn ghost" id="reset">Reset count</button>
  </div>
</div>
