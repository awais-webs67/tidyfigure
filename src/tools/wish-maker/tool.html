<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
  .wish-view { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; text-align: center; padding: 24px; overflow-y: auto; }
  .wish-view canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wish-card { position: relative; max-width: 620px; display: flex; flex-direction: column; gap: 14px; align-items: center; animation: wishIn .9s cubic-bezier(.2,.7,.2,1) both; }
  .wish-card .w-occ { font: 400 clamp(46px, 11vw, 92px)/1.1 Pacifico, cursive; }
  .wish-card .w-to { font: 400 clamp(40px, 9vw, 80px)/1 "Bebas Neue", Impact, sans-serif; letter-spacing: .03em; }
  .wish-card .w-msg { font: 500 clamp(17px, 2.6vw, 21px)/1.6 Inter, sans-serif; max-width: 34ch; }
  .wish-card .w-from { font: 400 clamp(22px, 4vw, 30px)/1.3 Pacifico, cursive; }
  @keyframes wishIn { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .wish-card { animation: none; } }
</style>
<div class="tool-grid">
  <div class="inputs">
    <label class="f"><span>Occasion</span><select id="occ"></select></label>
    <div class="fields">
      <label class="f"><span>To</span><input type="text" id="to" value="Sara" maxlength="40" autocomplete="off"></label>
      <label class="f"><span>From</span><input type="text" id="from" value="Ali" maxlength="40" autocomplete="off"></label>
    </div>
    <label class="f"><span>Message</span><textarea id="msg" maxlength="400" style="min-height:90px"></textarea></label>
    <button type="button" class="btn ghost" id="suggest">Suggest another message</button>
  </div>
  <div class="out" id="out">
    <p class="kicker">Your wish link</p>
    <div class="copybox" id="link" style="font-size:13px"></div>
    <div class="btns">
      <button type="button" class="btn" data-copy="link">Copy link</button>
      <a class="btn ghost" id="wa" target="_blank" rel="noopener">Share on WhatsApp</a>
      <button type="button" class="btn ghost" id="preview">Preview</button>
    </div>
    <p class="note">The message is stored inside the link itself, not on our server. Anyone with the link can read it.</p>
  </div>
</div>
<div class="wish-view" id="view" hidden><canvas id="fx"></canvas><div class="wish-card" id="card"></div></div>
