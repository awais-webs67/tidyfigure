<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose an image" style="padding:20px">
      <strong>Drop an image here or click to choose</strong>
      <span id="loaded">JPG, PNG or WebP</span>
      <input type="file" id="file" accept="image/*">
    </div>
    <div class="btns">
      <button type="button" class="btn ghost" data-a="ccw">⟲ Left 90°</button>
      <button type="button" class="btn ghost" data-a="cw">⟳ Right 90°</button>
      <button type="button" class="btn ghost" data-a="fh">⇋ Flip horizontal</button>
      <button type="button" class="btn ghost" data-a="fv">⇵ Flip vertical</button>
    </div>
    <label class="f"><span>Straighten: <b id="av">0</b>°</span><input type="range" id="angle" min="-45" max="45" step="0.5" value="0"></label>
    <label class="check"><input type="checkbox" id="autocrop" checked>Crop away the corners after straightening</label>
    <div class="btns"><button type="button" class="btn ghost" id="reset">Reset</button><button type="button" class="btn ghost" id="sample">Try a sample photo</button></div>
  </div>
  <div class="out">
    <div class="stage" style="background:#20272d"><canvas id="cv" width="10" height="10"></canvas></div>
    <p class="note" id="info"></p>
    <button type="button" class="btn" id="save" disabled>Download</button>
  </div>
</div>
