<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a PDF to split">
      {{icon:file-up}}
      <strong>Drop a PDF here or click to choose</strong>
      <span id="loaded">One PDF at a time</span>
      <input type="file" id="file" accept="application/pdf,.pdf">
    </div>
    <div class="seg" role="radiogroup" aria-label="How to split">
      <label><input type="radio" name="mode" id="mode-range" value="range" checked><span>Extract pages</span></label>
      <label><input type="radio" name="mode" id="mode-every" value="every"><span>Every page</span></label>
      <label><input type="radio" name="mode" id="mode-chunk" value="chunk"><span>Every N pages</span></label>
    </div>
    <label class="f" id="range-wrap"><span>Pages to keep (e.g. 1-3, 5, 8-10)</span><input type="text" id="range" value="1-2" autocomplete="off"></label>
    <label class="f" id="chunk-wrap" hidden><span>Pages per file</span><input type="number" id="chunk" inputmode="numeric" min="1" step="1" value="2"></label>
    <div class="btns">
      <button type="button" class="btn big-btn" id="go" disabled>{{icon:scissors}}Split PDF</button>
      <button type="button" class="btn ghost" id="sample">Try with a sample PDF</button>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Result</p>
    <p class="empty">Choose a PDF to see its pages.</p>
  </div>
</div>
