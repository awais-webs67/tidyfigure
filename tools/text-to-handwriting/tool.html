<style>
  .hw-fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; max-height: 236px; overflow-y: auto; padding: 2px; }
  .hw-fonts button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 6px; font-size: 21px; line-height: 1.2; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hw-fonts button.on { border-color: var(--accent); background: var(--accent-soft); }
  .hw-inks { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hw-inks button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .hw-inks button.on { box-shadow: 0 0 0 3px var(--accent); }
  .hw-pages { display: grid; gap: 16px; }
  .hw-page { position: relative; }
  .hw-page canvas { width: 100%; height: auto; display: block; box-shadow: 0 4px 18px rgba(0, 0, 0, .14); border-radius: 2px; background: #fff; }
  .hw-page .btns { margin-top: 6px; }
</style>
<div class="tool-grid">
  <div class="inputs">
    <label class="f"><span>Your text</span><textarea id="txt" rows="8"></textarea></label>
    <p class="group-title">Handwriting</p>
    <div class="hw-fonts" id="fonts"></div>
    <div class="fields">
      <label class="f"><span>Paper</span><select id="paper"><option value="notebook">Ruled notebook (margin)</option><option value="ruled">Ruled</option><option value="grid">Grid</option><option value="dots">Dotted</option><option value="legal">Yellow legal pad</option><option value="plain">Plain white</option><option value="old">Old paper</option></select></label>
      <label class="f"><span>Page size</span><select id="size"><option value="a4">A4</option><option value="letter">US Letter</option></select></label>
    </div>
    <div class="hw-inks" id="inks"><span class="sub" style="font-weight:600">Ink</span></div>
    <div class="fields">
      <label class="f"><span>Size: <b id="szv"></b></span><input type="range" id="fsz" min="20" max="60" value="34"></label>
      <label class="f"><span>Line spacing: <b id="lsv"></b></span><input type="range" id="lh" min="40" max="90" value="56"></label>
      <label class="f"><span>Natural wobble: <b id="wbv"></b></span><input type="range" id="wob" min="0" max="100" value="35"></label>
      <label class="f"><span>Letter spacing: <b id="lspv"></b></span><input type="range" id="lsp" min="-3" max="6" value="0"></label>
    </div>
    <div class="btns">
      <label class="check"><input type="checkbox" id="scan"> Scanned look</label>
      <button type="button" class="btn ghost" id="vary">New variation</button>
    </div>
  </div>
  <div class="out" id="out">
    <div class="btns" style="justify-content:space-between;align-items:center"><p class="kicker" id="count">Preview</p><div class="btns"><button type="button" class="btn" id="pdf">{{icon:download}}Download PDF</button><button type="button" class="btn ghost" id="all">All pages (JPG)</button></div></div>
    <div class="hw-pages" id="pages"></div>
  </div>
</div>
