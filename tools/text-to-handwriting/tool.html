<style>
  .hw-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .hw-tb { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; background: var(--surface-2); position: sticky; top: var(--header-h); z-index: 3; }
  .hw-tb button, .hw-tb select, .hw-tb label { height: 34px; min-width: 34px; border: 1px solid transparent; background: none; border-radius: 7px; cursor: pointer; color: var(--ink); font: 700 15px/1 var(--f-body); display: inline-flex; align-items: center; justify-content: center; padding: 0 7px; width: auto; }
  .hw-tb button:hover, .hw-tb label:hover { background: var(--surface); border-color: var(--line); }
  .hw-tb button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .hw-tb select { border-color: var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; padding: 0 6px; }
  .hw-tb .sep { width: 1px; background: var(--line); margin: 4px 2px; }
  .hw-tb input[type=color] { width: 0; height: 0; opacity: 0; position: absolute; }
  .hw-tb svg { width: 18px; height: 18px; }
  .hw-ed { min-height: 300px; max-height: 520px; overflow-y: auto; padding: 14px 16px; border: 1px solid var(--line); border-radius: 0 0 10px 10px; background: var(--surface); color: var(--ink); font: 16px/1.6 var(--f-body); outline: none; }
  .hw-ed:focus { border-color: var(--accent); }
  .hw-ed ul, .hw-ed ol { margin: 0; padding-left: 1.4em; }
  .hw-ed p, .hw-ed div { margin: 0; }
  .hw-fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; max-height: 210px; overflow-y: auto; padding: 2px; }
  .hw-fonts button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 6px; font-size: 20px; line-height: 1.2; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hw-fonts button.on { border-color: var(--accent); background: var(--accent-soft); }
  .hw-inks { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hw-inks button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .hw-inks button.on { box-shadow: 0 0 0 3px var(--accent); }
  .hw-pages { display: grid; gap: 16px; }
  .hw-page canvas { width: 100%; height: auto; display: block; box-shadow: 0 4px 18px rgba(0, 0, 0, .14); border-radius: 2px; background: #fff; }
  .hw-page .btns { margin-top: 6px; align-items: center; }
  .hw-prev { position: sticky; top: calc(var(--header-h) + 10px); max-height: calc(100vh - var(--header-h) - 20px); overflow-y: auto; }
  @media (max-width: 860px) {
    .hw-wrap { grid-template-columns: 1fr; }
    .hw-tb { position: static; }
    .hw-prev { position: static; max-height: none; overflow: visible; }
    .hw-ed { min-height: 200px; max-height: none; }
    .hw-fonts { grid-template-columns: none; grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: 132px; max-height: none; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; padding-bottom: 6px; }
    .hw-fonts button { scroll-snap-align: start; }
  }
</style>
<div class="hw-wrap">
  <div class="inputs">
    <div>
      <div class="hw-tb" id="tb" role="toolbar" aria-label="Formatting">
        <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo">{{icon:undo-2}}</button>
        <button type="button" data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo">{{icon:redo-2}}</button>
        <span class="sep"></span>
        <button type="button" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i style="font-family:Georgia,serif">I</i></button>
        <button type="button" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
        <button type="button" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
        <select id="fsel" title="Text size" aria-label="Text size"><option value="2">Small</option><option value="3" selected>Normal</option><option value="5">Large</option><option value="6">Huge</option></select>
        <label title="Ink colour of the selected text" aria-label="Ink colour"><span id="cdot" style="display:inline-block;width:16px;height:16px;border-radius:50%;background:#C42B2B;box-shadow:0 0 0 1px var(--line)"></span>&nbsp;A<input type="color" id="tcolor" value="#C42B2B"></label>
        <button type="button" data-cmd="hilite" title="Highlighter" aria-label="Highlighter"><span style="background:#FFE45C;padding:1px 4px;border-radius:3px">H</span></button>
        <span class="sep"></span>
        <button type="button" data-cmd="justifyLeft" title="Align left" aria-label="Align left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
        <button type="button" data-cmd="justifyCenter" title="Centre" aria-label="Centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
        <button type="button" data-cmd="justifyRight" title="Align right" aria-label="Align right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
        <button type="button" data-cmd="justifyFull" title="Justify" aria-label="Justify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
        <button type="button" data-cmd="insertUnorderedList" title="Bullet list" aria-label="Bullet list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
        <button type="button" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 6h10M10 12h10M10 18h10M4 5l1.5-1v5M3.5 13.5c0-1 2.5-1.6 2.5 0 0 1-2.5 2-2.5 3.5h2.7"/></svg></button>
        <button type="button" data-cmd="heading" title="Heading" aria-label="Heading">H</button>
        <button type="button" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">{{icon:eraser}}</button>
      </div>
      <div class="hw-ed" id="ed" contenteditable="true" spellcheck="true" aria-label="Your text" role="textbox" aria-multiline="true"></div>
    </div>
    <p class="group-title">Handwriting</p>
    <div class="hw-fonts" id="fonts"></div>
    <div class="hw-inks" id="inks"><span class="sub" style="font-weight:600">Main ink</span></div>
    <div class="fields">
      <label class="f"><span>Paper</span><select id="paper"><option value="notebook">Ruled notebook (margin)</option><option value="ruled">Ruled</option><option value="ruledborder">Ruled with border</option><option value="plain">Plain white</option><option value="border">Plain with border</option><option value="grid">Grid</option><option value="dots">Dotted</option><option value="legal">Yellow legal pad</option><option value="old">Old paper</option></select></label>
      <label class="f"><span>Page size</span><select id="size"><option value="a4">A4</option><option value="letter">US Letter</option></select></label>
      <label class="f"><span>Margins</span><select id="margin"><option value="0.8">Narrow</option><option value="1" selected>Normal</option><option value="1.35">Wide</option></select></label>
    </div>
    <div class="fields">
      <label class="f"><span>Text size: <b id="szv"></b></span><input type="range" id="fsz" min="22" max="56" value="34"></label>
      <label class="f"><span>Line spacing: <b id="lsv"></b></span><input type="range" id="lh" min="42" max="90" value="58"></label>
      <label class="f"><span>Natural wobble: <b id="wbv"></b></span><input type="range" id="wob" min="0" max="100" value="35"></label>
    </div>
    <div class="fields">
      <label class="f"><span>Name at the top (optional)</span><input id="hname" maxlength="60" placeholder="e.g. Ayesha Khan"></label>
      <label class="f"><span>Date at the top (optional)</span><input id="hdate" maxlength="40" placeholder="e.g. 12 March 2026"></label>
    </div>
    <div class="btns">
      <label class="check"><input type="checkbox" id="pnum"> Page numbers</label>
      <label class="check"><input type="checkbox" id="scan"> Scanned look</label>
      <button type="button" class="btn ghost" id="vary">New variation</button>
    </div>
  </div>
  <div class="out hw-prev" id="out" data-pip="last">
    <div class="btns" style="justify-content:space-between;align-items:center"><p class="kicker" id="count">Preview</p><div class="btns"><button type="button" class="btn" id="pdf">{{icon:download}}PDF</button><button type="button" class="btn ghost" id="all">All pages (JPG)</button></div></div>
    <div class="hw-pages" id="pages"></div>
  </div>
</div>
