<div class="tool-grid" id="wd-root">
  <form class="inputs" id="wd" novalidate>
    <div class="qb-card">
      <div class="f"><span>Design</span><div class="chips wd-cats" id="cats" role="group" aria-label="Design groups"><button type="button" class="chip on" data-cat="new" aria-pressed="true">New 2026</button><button type="button" class="chip" data-cat="islamic" aria-pressed="false">Nikah</button><button type="button" class="chip" data-cat="mehndi" aria-pressed="false">Mehndi</button><button type="button" class="chip" data-cat="floral" aria-pressed="false">Floral</button><button type="button" class="chip" data-cat="modern" aria-pressed="false">Modern</button><button type="button" class="chip" data-cat="luxury" aria-pressed="false">Luxury</button><button type="button" class="chip" data-cat="photo" aria-pressed="false">With photo</button><button type="button" class="chip" data-cat="classic" aria-pressed="false">Traditional</button><button type="button" class="chip" data-cat="all" aria-pressed="false">All</button></div><div class="wd-tpls" id="tpls"><label class="wd-t-archway" data-cat="modern floral"><input type="radio" name="tpl" value="archway" checked><i></i>Arch &amp; seal</label><label class="wd-t-atelier" data-cat="modern"><input type="radio" name="tpl" value="atelier"><i></i>Editorial</label><label class="wd-t-palace" data-cat="islamic floral"><input type="radio" name="tpl" value="palace"><i></i>Mughal pastel</label><label class="wd-t-nikahline" data-cat="islamic"><input type="radio" name="tpl" value="nikahline"><i></i>Nikah jaali</label><label class="wd-t-bordeaux" data-cat="luxury modern"><input type="radio" name="tpl" value="bordeaux"><i></i>Bordeaux</label><label class="wd-t-stone" data-cat="luxury modern"><input type="radio" name="tpl" value="stone"><i></i>Quiet luxury</label><label class="wd-t-goldline" data-cat="floral luxury"><input type="radio" name="tpl" value="goldline"><i></i>Gold line</label><label class="wd-t-wildflower" data-cat="floral"><input type="radio" name="tpl" value="wildflower"><i></i>Wildflower</label><label class="wd-t-noirink" data-cat="luxury modern"><input type="radio" name="tpl" value="noirink"><i></i>Black tie</label><label class="wd-t-mehndipop" data-cat="mehndi"><input type="radio" name="tpl" value="mehndipop"><i></i>Mehndi night</label><label class="wd-t-retro" data-cat="mehndi modern"><input type="radio" name="tpl" value="retro"><i></i>Groovy</label><label class="wd-t-magazine" data-cat="photo modern"><input type="radio" name="tpl" value="magazine"><i></i>Magazine</label><label class="wd-t-photo" data-cat="photo floral"><input type="radio" name="tpl" value="photo"><i></i>Photo arch</label><label class="wd-t-cover" data-cat="photo luxury"><input type="radio" name="tpl" value="cover"><i></i>Photo cover</label><label class="wd-t-royal" data-cat="classic islamic" hidden><input type="radio" name="tpl" value="royal"><i></i>Royal</label><label class="wd-t-nikah" data-cat="classic islamic" hidden><input type="radio" name="tpl" value="nikah"><i></i>Nikah arch</label><label class="wd-t-emerald" data-cat="classic" hidden><input type="radio" name="tpl" value="emerald"><i></i>Emerald</label><label class="wd-t-mehndi" data-cat="classic mehndi" hidden><input type="radio" name="tpl" value="mehndi"><i></i>Mehndi</label><label class="wd-t-truckart" data-cat="classic mehndi" hidden><input type="radio" name="tpl" value="truckart"><i></i>Truck art</label><label class="wd-t-blush" data-cat="classic" hidden><input type="radio" name="tpl" value="blush"><i></i>Blush</label><label class="wd-t-garden" data-cat="classic" hidden><input type="radio" name="tpl" value="garden"><i></i>Garden</label><label class="wd-t-sage" data-cat="classic" hidden><input type="radio" name="tpl" value="sage"><i></i>Sage</label><label class="wd-t-editorial" data-cat="classic" hidden><input type="radio" name="tpl" value="editorial"><i></i>Side date</label><label class="wd-t-ivory" data-cat="classic" hidden><input type="radio" name="tpl" value="ivory"><i></i>Classic</label><label class="wd-t-monogram" data-cat="classic" hidden><input type="radio" name="tpl" value="monogram"><i></i>Monogram</label><label class="wd-t-noir" data-cat="classic" hidden><input type="radio" name="tpl" value="noir"><i></i>Noir gold</label><label class="wd-t-navy" data-cat="classic" hidden><input type="radio" name="tpl" value="navy"><i></i>Art deco</label><label class="wd-t-savedate" data-cat="classic" hidden><input type="radio" name="tpl" value="savedate"><i></i>Save the date</label></div></div>
      <div class="f" id="photo-f"><span>Couple photo (optional, for the photo designs)</span><input type="file" id="photo" accept="image/jpeg,image/png,image/webp"><div id="photoprev"></div></div>
      <div class="seg" role="radiogroup" aria-label="Language">
        <label><input type="radio" name="lang" value="en" checked><span>English</span></label>
        <label><input type="radio" name="lang" value="ur"><span>اردو Urdu</span></label>
      </div>
      <label class="check"><input type="checkbox" name="bismillah" checked> Start with Bismillah (بسم اللہ)</label>
      <div class="seg" role="radiogroup" aria-label="Card size">
        <label><input type="radio" name="size" value="card" checked><span>Card (2 : 3)</span></label>
        <label><input type="radio" name="size" value="story"><span>Phone story (9 : 16)</span></label>
      </div>
    </div>
    <div class="qb-card">
      <div class="fields">
        <label class="f"><span>Groom’s name</span><input type="text" name="groom" maxlength="60" value="Ahmed"></label>
        <label class="f"><span>Bride’s name</span><input type="text" name="bride" maxlength="60" value="Ayesha"></label>
      </div>
      <div class="fields">
        <label class="f"><span>Groom’s father or parents (optional)</span><input type="text" name="gp" maxlength="120" placeholder="Mr Khalid Mehmood"></label>
        <label class="f"><span>Bride’s father or parents (optional)</span><input type="text" name="bp" maxlength="120" placeholder="Mr Tariq Hussain"></label>
      </div>
      <label class="f"><span>Invited by (optional)</span><input type="text" name="hosts" maxlength="120" placeholder="Together with their families"></label>
      <label class="f"><span>Message (optional)</span><textarea name="msg" maxlength="400" rows="2" placeholder="Your presence and prayers will make our day complete."></textarea></label>
    </div>
    <div class="qb-card">
      <p class="kicker">Events</p>
      <div id="events" class="rows-list"><div class="row"><div class="fields"><label class="f"><span>Event</span><input type="text" class="en" list="evlist" maxlength="40" value="Baraat" placeholder="Baraat"></label><label class="f"><span>Date</span><input type="date" class="ed" value=""></label><label class="f"><span>Time</span><input type="time" class="et" value="19:00"></label></div><div class="fields"><label class="f"><span>Venue</span><input type="text" class="ev" maxlength="120" value="Royal Palm Marquee" placeholder="Royal Palm Marquee"></label><label class="f"><span>Address</span><input type="text" class="ea" maxlength="220" value="Canal Road, Lahore" placeholder="Canal Road, Lahore"></label></div><div class="fields" style="grid-template-columns:1fr auto"><label class="f"><span>Google Maps link (optional)</span><input type="text" class="em" inputmode="url" autocapitalize="off" value="" placeholder="https://maps.app.goo.gl/…"></label><button type="button" class="btn ghost" data-rm style="align-self:end">Remove</button></div></div><div class="row"><div class="fields"><label class="f"><span>Event</span><input type="text" class="en" list="evlist" maxlength="40" value="Walima" placeholder="Baraat"></label><label class="f"><span>Date</span><input type="date" class="ed" value=""></label><label class="f"><span>Time</span><input type="time" class="et" value="20:00"></label></div><div class="fields"><label class="f"><span>Venue</span><input type="text" class="ev" maxlength="120" value="Pearl Continental" placeholder="Royal Palm Marquee"></label><label class="f"><span>Address</span><input type="text" class="ea" maxlength="220" value="Mall Road, Lahore" placeholder="Canal Road, Lahore"></label></div><div class="fields" style="grid-template-columns:1fr auto"><label class="f"><span>Google Maps link (optional)</span><input type="text" class="em" inputmode="url" autocapitalize="off" value="" placeholder="https://maps.app.goo.gl/…"></label><button type="button" class="btn ghost" data-rm style="align-self:end">Remove</button></div></div></div>
      <div class="btns"><button type="button" class="btn ghost" id="adde">Add an event</button></div>
    </div>
    <div class="qb-card">
      <p class="kicker">RSVP and contacts</p>
      <label class="check"><input type="checkbox" name="rsvp" checked> Let guests reply online (RSVP)</label>
      <label class="f"><span>Reply by (optional)</span><input type="date" name="rsvp_by"></label>
      <div class="fields">
        <label class="f"><span>Contact name</span><input type="text" name="c1n" maxlength="40" placeholder="Khalid"></label>
        <label class="f"><span>Phone</span><input type="tel" name="c1p" maxlength="20" placeholder="0300 1234567"></label>
      </div>
      <div class="fields">
        <label class="f"><span>Second contact</span><input type="text" name="c2n" maxlength="40"></label>
        <label class="f"><span>Phone</span><input type="tel" name="c2p" maxlength="20"></label>
      </div>
    </div>
  </form>
  <div class="out live" id="out" aria-live="polite">
    <p class="kicker">Your card</p>
    <canvas id="cv" class="wd-preview" width="1080" height="1620" aria-label="Wedding card preview"></canvas>
    <div class="btns"><button type="button" class="btn" id="png">Download picture</button><button type="button" class="btn ghost" id="pdf">PDF</button></div>
    <button type="button" class="sh-btn wide" id="go" style="--sh-a:#B8860B;--sh-b:#D4AF37">💌 Create online invitation</button>
    <p class="note">One link for all your guests: the card in an opening envelope, a countdown, directions, add-to-calendar and RSVP.</p>
    <div id="done"></div>
  </div>
</div>
<div class="qb-card" id="mine" style="margin-top:18px"></div>
