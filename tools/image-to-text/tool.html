<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose an image or PDF">
      {{icon:scan-line}}
      <strong>Drop an image or scanned PDF here</strong>
      <span>JPG, PNG, WebP, screenshots or PDF · or paste with Ctrl+V</span>
      <input type="file" id="file" accept="image/*,.pdf">
    </div>
    <div class="fields">
      <label class="f"><span>Language of the text</span><select id="lang">
        <option value="eng" selected>English</option><option value="urd">Urdu</option><option value="ara">Arabic</option><option value="hin">Hindi</option><option value="ben">Bengali</option>
        <option value="spa">Spanish</option><option value="fra">French</option><option value="deu">German</option><option value="por">Portuguese</option><option value="ita">Italian</option>
        <option value="nld">Dutch</option><option value="pol">Polish</option><option value="tur">Turkish</option><option value="rus">Russian</option><option value="ukr">Ukrainian</option>
        <option value="ind">Indonesian</option><option value="vie">Vietnamese</option><option value="fas">Persian</option><option value="chi_sim">Chinese (simplified)</option><option value="jpn">Japanese</option><option value="kor">Korean</option>
      </select></label>
      <label class="f"><span>Second language (optional)</span><select id="lang2"><option value="">None</option><option value="eng">English</option><option value="urd">Urdu</option><option value="ara">Arabic</option><option value="hin">Hindi</option><option value="fra">French</option><option value="spa">Spanish</option><option value="deu">German</option></select></label>
    </div>
    <div id="preview" class="ocr-preview" hidden></div>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Extracted text</p>
    <p class="empty">Choose a picture of text, a screenshot or a scanned PDF. The text is read on your device.</p>
    <button type="button" class="btn ghost" id="sample">Try it with a sample image</button>
  </div>
</div>
