<div class="tool-grid">
  <div class="inputs">
    <div class="out" style="text-align:center;align-items:center">
      <p class="kicker" id="status">Ready to record</p>
      <p class="timer-big" id="time">0:00.0</p>
      <canvas id="level" width="600" height="60" style="width:100%;height:60px" aria-hidden="true"></canvas>
      <div class="btns" style="justify-content:center">
        <button type="button" class="btn big-btn" id="rec">{{icon:mic}}Start recording</button>
        <button type="button" class="btn ghost" id="pause" disabled>Pause</button>
      </div>
    </div>
    <div class="fields">
      <label class="check"><input type="checkbox" id="ns" checked>Reduce background noise</label>
      <label class="check"><input type="checkbox" id="ec" checked>Cancel echo</label>
    </div>
    <p class="note">Your browser will ask for permission to use the microphone. Recordings stay on this device and disappear when you close the page, so download the ones you want to keep.</p>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Recordings</p>
    <p class="empty">Press Start recording and speak. Your recordings will appear here.</p>
  </div>
</div>
