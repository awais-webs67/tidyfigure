<div class="tool-grid">
  <div class="inputs">
    <div class="fields">
      <label class="f"><span>First day of your last period</span><input type="date" id="lmp"></label>
      <label class="f"><span>Average cycle length (days)</span><input type="number" id="cycle" inputmode="numeric" min="21" max="40" step="1" value="28"></label>
      <label class="f"><span>Period length (days)</span><input type="number" id="plen" inputmode="numeric" min="2" max="10" step="1" value="5"></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
