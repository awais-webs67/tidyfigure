<div class="tool-grid">
  <div class="inputs">
    <div class="fields" style="grid-template-columns:minmax(0,1fr) 120px">
      <label class="f"><span>Regular expression</span><input type="text" id="re" class="mono" value="\b([\w.+-]+)@([\w-]+\.[\w.]+)\b" autocomplete="off" spellcheck="false"></label>
      <label class="f"><span>Flags</span><input type="text" id="flags" class="mono" value="gi" maxlength="8" autocomplete="off" spellcheck="false"></label>
    </div>
    <label class="f"><span>Test text</span><textarea id="text" class="mono" style="min-height:150px" spellcheck="false">Contact sales@example.com or support@help.example.org.
Old address: john.smith+news@mail.co.uk (no longer used)
Not an email: user@localhost, @handle, name@</textarea></label>
    <label class="f"><span>Replace with (optional, use $1, $2 for groups)</span><input type="text" id="rep" class="mono" placeholder="e.g. [$1 at $2]"></label>
    <div class="chips" id="lib">
      <button type="button" class="chip" data-r="\b[\w.+-]+@[\w-]+\.[\w.]+\b" data-f="gi">Email</button>
      <button type="button" class="chip" data-r="https?:\/\/[^\s/$.?#].[^\s]*" data-f="gi">URL</button>
      <button type="button" class="chip" data-r="\+?\d[\d\s().-]{7,}\d" data-f="g">Phone</button>
      <button type="button" class="chip" data-r="\b\d{4}-\d{2}-\d{2}\b" data-f="g">Date (YYYY-MM-DD)</button>
      <button type="button" class="chip" data-r="#(?:[0-9a-fA-F]{3}){1,2}\b" data-f="g">Hex colour</button>
      <button type="button" class="chip" data-r="\b(?:\d{1,3}\.){3}\d{1,3}\b" data-f="g">IPv4</button>
      <button type="button" class="chip" data-r="^\s*$\n?" data-f="gm">Empty lines</button>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
