<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="How to make the signature">
      <label><input type="radio" name="mode" value="draw" checked><span>Draw</span></label>
      <label><input type="radio" name="mode" value="type"><span>Type</span></label>
      <label><input type="radio" name="mode" value="photo"><span>From a photo</span></label>
    </div>
    <div data-mode="draw">
      <div class="sig-pad-wrap"><canvas id="pad" class="sig-pad" aria-label="Signature drawing area"></canvas><span class="sig-line" aria-hidden="true"></span></div>
      <div class="btns" style="margin-top:8px"><button type="button" class="btn ghost" id="undo">Undo</button><button type="button" class="btn ghost" id="clear">Clear</button></div>
    </div>
    <div data-mode="type" hidden>
      <label class="f"><span>Your name</span><input type="text" id="name" value="Sarah Johnson" maxlength="40"></label>
      <div class="sig-fonts" id="fonts"></div>
    </div>
    <div data-mode="photo" hidden>
      <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a photo of your signature" style="padding:20px">
        {{icon:image-up}}<strong>Photo of your signature on white paper</strong><span>The paper is removed, leaving only the ink</span>
        <input type="file" id="file" accept="image/*">
      </div>
      <label class="f"><span>Ink threshold: <b id="tv">55</b></span><input type="range" id="thr" min="20" max="90" value="55"></label>
    </div>
    <div class="fields">
      <div class="f"><span>Ink colour</span><div class="chips" id="colors"><button type="button" class="chip on" data-c="#111111">Black</button><button type="button" class="chip" data-c="#1a3f8f">Blue</button><button type="button" class="chip" data-c="#0b5d3b">Green</button><input type="color" id="color" value="#111111" aria-label="Custom colour" style="width:40px;height:34px"></div></div>
      <label class="f" id="w-wrap"><span>Pen width: <b id="wv">3</b></span><input type="range" id="width" min="1" max="8" step="0.5" value="3"></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Preview on a document</p>
    <div class="sig-doc"><p>I agree to the terms above.</p><div class="sig-slot"><img id="prev" alt="Your signature"></div><span>Signature</span></div>
    <div class="btns"><button type="button" class="btn big-btn" id="png">{{icon:download}}Transparent PNG</button><button type="button" class="btn ghost" id="jpg">JPG</button><button type="button" class="btn ghost" id="svg">SVG</button></div>
    <p class="note" id="meta"></p>
  </div>
</div>
