<style>
  .ff-list { display: grid; gap: 12px; }
  .ff-list h3 { margin: 6px 0 0; font: 700 12px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ff-check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
  .ff-check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .ff-radios { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .ff-pages { display: grid; gap: 12px; }
  .ff-pages canvas { width: 100%; height: auto; display: block; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); background: #fff; }
</style>
<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a PDF form">
      {{icon:file-up}}
      <strong>Drop a fillable PDF here or click to choose</strong>
      <span id="loaded">Its fields appear below</span>
      <input type="file" id="file" accept="application/pdf,.pdf">
    </div>
    <div class="ff-list" id="fields"></div>
    <label class="ff-check" id="flatwrap" hidden><input type="checkbox" id="flat"> Lock the answers (flatten the form)</label>
    <div class="btns">
      <button type="button" class="btn big-btn" id="go" disabled>{{icon:download}}Save filled PDF</button>
      <button type="button" class="btn ghost" id="sample">Try a sample form</button>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Preview</p>
    <p class="empty">Choose a PDF form to see it filled in here.</p>
  </div>
</div>
