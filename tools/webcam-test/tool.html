<style>
  .wc-stage { position: relative; background: #111; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; display: grid; place-items: center; color: #aaa; }
  .wc-stage video { width: 100%; height: 100%; object-fit: contain; }
  .wc-stage.mirror video { transform: scaleX(-1); }
</style>
<div class="tool-grid">
  <div class="inputs">
    <div class="wc-stage mirror" id="stage"><span id="ph">Camera preview</span><video id="v" playsinline muted hidden></video></div>
    <div class="btns">
      <button type="button" class="btn big-btn" id="go">{{icon:webcam}}<span>Start webcam test</span></button>
      <button type="button" class="btn ghost" id="best" hidden>Find the best quality</button>
      <button type="button" class="btn ghost" id="snap" hidden>{{icon:camera}}Snapshot</button>
      <button type="button" class="btn ghost" id="stop" hidden>Stop</button>
    </div>
    <div class="fields">
      <label class="f" hidden><span>Camera</span><select id="dev"></select></label>
      <label class="f"><span>Preview</span><select id="mir"><option value="1" selected>Mirrored (like a mirror)</option><option value="0">As others see you</option></select></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"><p class="kicker">Result</p><p class="empty">Click <b>Start webcam test</b> and allow the camera.</p></div>
</div>
