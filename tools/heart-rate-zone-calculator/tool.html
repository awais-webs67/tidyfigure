<div class="tool-grid">
  <div class="inputs">
    <div class="fields">
      <label class="f"><span>Age</span><input type="number" id="age" inputmode="numeric" min="10" max="100" step="1" value="35"></label>
      <label class="f"><span>Resting heart rate (optional)</span><input type="number" id="rest" inputmode="numeric" min="30" max="120" step="1" placeholder="e.g. 62"></label>
      <label class="f"><span>Known max heart rate (optional)</span><input type="number" id="max" inputmode="numeric" min="100" max="230" step="1" placeholder="from a test"></label>
    </div>
    <p class="note">To find your resting heart rate, count your pulse for 60 seconds just after waking, before getting up.</p>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
