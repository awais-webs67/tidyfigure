<div class="inputs">
  <form class="fields" id="form" style="grid-template-columns:minmax(0,1fr) auto;align-items:end">
    <label class="f"><span>YouTube channel: @handle, channel link or ID</span><input type="text" id="ch" value="@YouTube" autocomplete="off" spellcheck="false"></label>
    <button class="btn big-btn" type="submit">{{icon:search}}Show live count</button>
  </form>
  <div class="out" id="out" aria-live="polite" style="align-items:center;text-align:center;padding:30px 18px">
    <p class="empty">Enter a channel to see its subscriber count.</p>
  </div>
</div>
