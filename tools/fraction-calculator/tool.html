<style>
  .fc-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .fc-row .f { flex: 1 1 120px; }
  .fc-row select { width: 70px; font-size: 22px; text-align: center; }
  .fc-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font: 700 28px/1.1 var(--f-num); color: var(--ink); margin: 0 4px; }
  .fc-frac span:first-child { border-bottom: 3px solid currentColor; padding: 0 6px; }
  .fc-big { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
  .fc-big .whole { font: 700 34px/1 var(--f-num); color: var(--ink); }
  .fc-steps { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-family: var(--f-num); font-size: 14px; }
</style>
<div class="tool-grid">
  <div class="inputs">
    <div class="fc-row">
      <label class="f"><span>First fraction</span><input id="a" value="1 1/2" autocomplete="off" inputmode="text"></label>
      <label class="f" style="flex:0 0 auto"><span>&nbsp;</span><select id="op" aria-label="Operation"><option>+</option><option>−</option><option>×</option><option>÷</option></select></label>
      <label class="f"><span>Second fraction</span><input id="b" value="3/4" autocomplete="off" inputmode="text"></label>
    </div>
    <p class="note">Examples: 3/4 · 2 1/3 (mixed) · -5/8 · 7 · 0.25</p>
    <p class="group-title" style="margin-top:8px">Simplify or convert</p>
    <label class="f"><span>A fraction or decimal</span><input id="c" value="0.375" autocomplete="off"></label>
    <div class="copybox" id="cout"></div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
