<style>
  .px-sheet { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .px-sheet table { border-collapse: collapse; font: 13px/1.35 var(--f-body); min-width: 100%; }
  .px-sheet th, .px-sheet td { border: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; text-align: left; color: var(--ink); }
  .px-sheet th { background: var(--surface-2); color: var(--muted); font-weight: 600; text-align: center; }
  .px-sheet td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .px-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .px-tabs button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 13px/1 var(--f-body); cursor: pointer; }
  .px-tabs button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
</style>
<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a PDF to convert">
      {{icon:file-up}}
      <strong>Drop a PDF here or click to choose</strong>
      <span id="loaded">Its tables become a spreadsheet</span>
      <input type="file" id="file" accept="application/pdf,.pdf">
    </div>
    <div class="seg" role="radiogroup" aria-label="What to bring across">
      <label><input type="radio" name="what" value="tables" checked><span>Tables only</span></label>
      <label><input type="radio" name="what" value="all"><span>All text</span></label>
    </div>
    <div class="seg" role="radiogroup" aria-label="Sheets">
      <label><input type="radio" name="sheets" value="page" checked><span>One sheet per page</span></label>
      <label><input type="radio" name="sheets" value="one"><span>All on one sheet</span></label>
    </div>
    <div class="btns"><button type="button" class="btn ghost" id="sample">Try with a sample PDF</button></div>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Spreadsheet</p>
    <p class="empty">Choose a PDF to convert it.</p>
  </div>
</div>
