<div class="tool-grid">
  <div class="inputs">
    <label class="f"><span>Paste JSON</span><textarea id="src" class="mono" spellcheck="false">{"name":"TidyFigure","tools":40,"free":true,"categories":["image","pdf","text"],"owner":{"country":null,"since":2026}}</textarea></label>
    <div class="fields">
      <label class="f"><span>Indent</span><select id="indent"><option value="2" selected>2 spaces</option><option value="4">4 spaces</option><option value="tab">Tabs</option></select></label>
      <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="sortkeys">Sort keys A–Z</label>
    </div>
    <div class="btns">
      <button type="button" class="btn" id="fmt-btn">Format</button>
      <button type="button" class="btn ghost" id="min-btn">Minify</button>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
