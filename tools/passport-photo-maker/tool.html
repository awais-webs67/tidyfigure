<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a photo">
      {{icon:image-up}}
      <strong>Drop a front-facing photo</strong>
      <span>Plain wall, even light, neutral expression</span>
      <input type="file" id="file" accept="image/*">
    </div>
    <label class="f"><span>Country and document</span><select id="preset"></select></label>
    <p class="note" id="spec"></p>
    <div class="fields">
      <label class="f"><span>Background</span><select id="bg"><option value="#ffffff" selected>White</option><option value="#f2f2f2">Off-white / light grey</option><option value="#dfe8f5">Light blue</option><option value="keep">Keep original</option></select></label>
      <label class="f"><span>Print sheet</span><select id="sheet"><option value="4x6" selected>4×6 in (10×15 cm) photo paper</option><option value="5x7">5×7 in (13×18 cm)</option><option value="a4">A4 page</option><option value="letter">US Letter page</option></select></label>
    </div>
    <div id="adjust" hidden>
      <p class="group-title">Fine-tune: drag the photo, or use the sliders</p>
      <div class="fields">
        <label class="f"><span>Zoom</span><input type="range" id="zoom" min="0.3" max="3" step="0.01" value="1"></label>
        <label class="f"><span>Up / down</span><input type="range" id="oy" min="-0.5" max="0.5" step="0.005" value="0"></label>
        <label class="f"><span>Left / right</span><input type="range" id="ox" min="-0.5" max="0.5" step="0.005" value="0"></label>
        <label class="f"><span>Straighten (°)</span><input type="range" id="rot" min="-15" max="15" step="0.1" value="0"></label>
        <label class="f"><span>Brightness</span><input type="range" id="bright" min="0.8" max="1.3" step="0.01" value="1"></label>
      </div>
      <button type="button" class="btn ghost" id="auto">Auto-position again</button>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Passport photo</p>
    <p class="empty">Choose a photo. The background is replaced and the head is positioned to the official size automatically.</p>
    <button type="button" class="btn ghost" id="sample">Try it with a sample photo</button>
  </div>
</div>
