<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose images to convert">
      {{icon:image-up}}
      <strong>Drop images here or click to choose</strong>
      <span>JPG, PNG, WebP, GIF, BMP, SVG, AVIF</span>
      <input type="file" id="file" accept="image/*" multiple>
    </div>
    <p class="group-title">Convert to</p>
    <div class="seg" role="radiogroup" aria-label="Convert to">
      <label><input type="radio" name="to" id="to-jpg" value="image/jpeg" checked><span>JPG</span></label>
      <label><input type="radio" name="to" id="to-png" value="image/png"><span>PNG</span></label>
      <label><input type="radio" name="to" id="to-webp" value="image/webp"><span>WebP</span></label>
    </div>
    <label class="f" id="q-wrap"><span>Quality: <b id="qv">90</b>%</span><input type="range" id="quality" min="40" max="100" step="1" value="90"></label>
    <label class="f" id="bg-wrap"><span>Background for transparent areas</span><input type="color" id="bg" value="#ffffff"></label>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Converted images</p>
    <p class="empty">Your converted images will appear here.</p>
    <button type="button" class="btn ghost" id="sample">Try it with a sample image</button>
  </div>
</div>
