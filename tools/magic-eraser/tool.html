<style>
  .me-stage { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; margin: 0 auto; line-height: 0; }
  .me-stage canvas { width: 100%; height: auto; display: block; }
  .me-stage .me-paint { position: absolute; inset: 0; opacity: .55; cursor: crosshair; }
  .me-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 10px 0; }
  .me-bar label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .me-bar input[type=range] { width: 140px; accent-color: var(--accent); }
  .me-ring { position: absolute; border: 2px solid #fff; outline: 1px solid rgba(0,0,0,.6); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); display: none; }
</style>
<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a photo">
      {{icon:image-up}}
      <strong>Drop a photo here or click to choose</strong>
      <span id="loaded">Then paint over what you want to remove</span>
      <input type="file" id="file" accept="image/*">
    </div>
    <div class="btns"><button type="button" class="btn ghost" id="sample">Try with a sample photo</button></div>
    <p class="note">The AI (about 28 MB) downloads the first time, then runs on your device.</p>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Magic Eraser</p>
    <p class="empty">Choose a photo, paint over what you want gone, then press Erase.</p>
  </div>
</div>
