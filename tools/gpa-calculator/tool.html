<div class="tool-grid">
  <div class="inputs">
    <div class="fields">
      <label class="f"><span>Grade scale</span><select id="scale"><option value="4.0" selected>4.0 scale (A+ = 4.0)</option><option value="4.3">4.3 scale (A+ = 4.3)</option></select></label>
    </div>
    <p class="group-title">This term’s courses</p>
    <div class="list" id="courses"></div>
    <button type="button" class="add" id="add-course">+ Add a course</button>
    <p class="group-title">Previous record (optional, for cumulative GPA)</p>
    <div class="fields">
      <label class="f"><span>Current cumulative GPA</span><input type="number" id="prev" inputmode="decimal" min="0" max="4.3" step="0.01" value="3.20"></label>
      <label class="f"><span>Credits completed so far</span><input type="number" id="prevc" inputmode="decimal" min="0" step="any" value="30"></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
