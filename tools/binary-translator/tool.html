<div class="tool-grid">
  <div class="inputs">
    <label class="f"><span>Text or binary</span><textarea id="in" rows="6" placeholder="Type text, or paste binary like 01001000 01101001"></textarea></label>
    <div class="fields">
      <label class="f"><span>Separate bytes with</span><select id="sep"><option value=" " selected>A space</option><option value="">Nothing</option><option value="&#10;">New line</option></select></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
