<div class="inputs">
  <form class="fields" id="form" style="grid-template-columns:minmax(0,1fr) auto;align-items:end">
    <label class="f"><span>YouTube video link</span><input type="url" id="url" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ" autocomplete="off" spellcheck="false"></label>
    <button class="btn big-btn" type="submit">{{icon:image-down}}Get thumbnails</button>
  </form>
  <div id="out" class="cards" aria-live="polite"></div>
  <p class="note">Thumbnails belong to the video’s creator. Use them for reference, research or with permission, and credit the creator if you share them.</p>
</div>
