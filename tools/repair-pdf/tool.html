<div class="tool-grid">
  <div class="inputs">
    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a damaged PDF">
      {{icon:file-up}}
      <strong>Drop a damaged PDF here or click to choose</strong>
      <span id="loaded">It’s repaired straight away</span>
      <input type="file" id="file" accept="application/pdf,.pdf,application/octet-stream">
    </div>
    <div class="btns"><button type="button" class="btn ghost" id="sample">Try with a damaged sample</button></div>
  </div>
  <div class="out" id="out" aria-live="polite">
    <p class="kicker">Repair</p>
    <p class="empty">Choose a PDF that won’t open properly.</p>
  </div>
</div>
