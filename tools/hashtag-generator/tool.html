<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="Mode">
      <label><input type="radio" name="mode" value="make" checked><span>Make hashtags</span></label>
      <label><input type="radio" name="mode" value="count"><span>Check a caption</span></label>
    </div>
    <label class="f" id="l-make"><span>Keywords or phrases (one per line, or separated by commas)</span><textarea id="kw" style="min-height:140px">home workout
fitness tips, healthy habits
morning routine
no gym needed</textarea></label>
    <label class="f" id="l-count" hidden><span>Paste your caption</span><textarea id="cap" style="min-height:140px">Sunrise run done ☀️ 5 km before breakfast! #morningrun #RunningCommunity #fitness #fitness #health #5k</textarea></label>
    <div class="fields" id="opts">
      <label class="f"><span>Style</span><select id="style"><option value="camel" selected>#CamelCase (easier to read)</option><option value="lower">#lowercase</option></select></label>
      <label class="f"><span>Separate with</span><select id="sep"><option value=" " selected>Spaces</option><option value="\n">New lines</option></select></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
