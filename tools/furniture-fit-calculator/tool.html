<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="Measurement unit">
      <label><input type="radio" name="unit" id="unit-in" value="in" checked><span>Inches</span></label>
      <label><input type="radio" name="unit" id="unit-cm" value="cm"><span>Centimetres</span></label>
    </div>
    <p class="group-title">Furniture (widest points)</p>
    <div class="fields">
      <label class="f"><span>Width (side to side)</span><input type="number" id="iw" inputmode="decimal" min="0" step="any" value="84"></label>
      <label class="f"><span>Depth (front to back)</span><input type="number" id="id" inputmode="decimal" min="0" step="any" value="35"></label>
      <label class="f"><span>Height</span><input type="number" id="ih" inputmode="decimal" min="0" step="any" value="30"></label>
    </div>
    <p class="group-title">Doorway (open, inside the frame)</p>
    <div class="fields">
      <label class="f"><span>Door width</span><input type="number" id="dw" inputmode="decimal" min="0" step="any" value="32"></label>
      <label class="f"><span>Door height</span><input type="number" id="dh" inputmode="decimal" min="0" step="any" value="80"></label>
    </div>
    <label class="check"><input type="checkbox" id="has-corner" checked>Also check a 90° hallway corner</label>
    <div class="fields" id="corner-fields">
      <label class="f"><span>Hallway width before turn</span><input type="number" id="ha" inputmode="decimal" min="0" step="any" value="42"></label>
      <label class="f"><span>Hallway width after turn</span><input type="number" id="hb" inputmode="decimal" min="0" step="any" value="36"></label>
      <label class="f"><span>Ceiling height</span><input type="number" id="ch" inputmode="decimal" min="0" step="any" value="96"></label>
    </div>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
