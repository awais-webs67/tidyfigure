<div class="tool-grid">
  <div class="inputs">
    <div class="seg" role="radiogroup" aria-label="Size unit">
      <label><input type="radio" name="unit" id="unit-in" value="in" checked><span>Inches</span></label>
      <label><input type="radio" name="unit" id="unit-cm" value="cm"><span>Centimetres</span></label>
    </div>
    <div class="list" id="pizzas"></div>
    <button type="button" class="add" id="add-pizza">+ Add another option</button>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
