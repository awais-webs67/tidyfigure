<style>
  .pm-dial { display: grid; place-items: center; text-align: center; gap: 6px; padding: 26px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  .pm-dial b { font: 700 clamp(64px, 14vw, 120px)/1 var(--f-num); color: var(--ink); font-variant-numeric: tabular-nums; }
  .pm-mode { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--accent); }
  .pm-dial.brk .pm-mode { color: var(--good); }
  .pm-prog { width: 100%; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .pm-prog i { display: block; height: 100%; width: 0; background: var(--accent); }
  .pm-dial.brk .pm-prog i { background: var(--good); }
  .pm-tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .pm-tasks li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .pm-tasks li.done span { text-decoration: line-through; color: var(--muted); }
  .pm-tasks span { flex: 1; overflow-wrap: anywhere; }
  .pm-tasks button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
</style>
<div class="tool-grid">
  <div class="inputs">
    <div class="pm-dial" id="dial"><span class="pm-mode" id="mode">Focus</span><b id="clock">25:00</b><div class="pm-prog"><i id="prog"></i></div><span class="sub" id="cycle"></span></div>
    <div class="btns" style="justify-content:center"><button type="button" class="btn big-btn" id="go">{{icon:play}}<span>Start</span></button><button type="button" class="btn ghost big-btn" id="skip">Skip</button><button type="button" class="btn ghost big-btn" id="reset">Reset</button></div>
    <details><summary>Settings</summary>
      <div class="fields" style="margin-top:10px">
        <label class="f"><span>Focus (min)</span><input type="number" id="s-work" min="1" max="180" value="25"></label>
        <label class="f"><span>Short break (min)</span><input type="number" id="s-short" min="1" max="60" value="5"></label>
        <label class="f"><span>Long break (min)</span><input type="number" id="s-long" min="1" max="90" value="15"></label>
        <label class="f"><span>Long break every</span><input type="number" id="s-every" min="2" max="10" value="4"></label>
      </div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="s-auto"> Start the next session automatically</label>
      <label class="check"><input type="checkbox" id="s-sound" checked> Play a chime</label>
      <button type="button" class="btn ghost" id="notify" style="margin-top:8px">Allow notifications</button>
    </details>
  </div>
  <div class="out">
    <p class="kicker">Today</p>
    <div class="statgrid"><div class="stat"><b id="today">0</b><span>focus sessions</span></div><div class="stat"><b id="mins">0</b><span>minutes focused</span></div></div>
    <p class="kicker" style="margin-top:8px">Tasks</p>
    <form id="tform" class="btns" style="flex-wrap:nowrap"><input id="tnew" placeholder="Add a task and press Enter" maxlength="120" aria-label="New task"><button class="btn">Add</button></form>
    <ul class="pm-tasks" id="tasks"></ul>
  </div>
</div>
