<style>
  .pc { display: grid; gap: 12px; }
  .pc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .pc-row input { width: 110px; flex: 0 0 auto; }
  .pc-row .eq { margin-left: auto; font: 700 22px/1.2 var(--f-num); color: var(--accent); min-width: 90px; text-align: right; overflow-wrap: anywhere; }
  .pc-row h2 { flex-basis: 100%; margin: 0 0 2px; font: 700 12px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .pc-row small { flex-basis: 100%; color: var(--muted); font-size: 13.5px; }
  @media (max-width: 560px) { .pc-row .eq { margin-left: 0; text-align: left; flex-basis: 100%; } }
</style>
<div class="pc">
  <div class="pc-row"><h2>Percentage of a number</h2>What is <input type="number" id="a1" inputmode="decimal" step="any" value="15" aria-label="Percent"> % of <input type="number" id="b1" inputmode="decimal" step="any" value="240" aria-label="Number"><span class="eq" id="r1"></span><small id="w1"></small></div>
  <div class="pc-row"><h2>What percent is it?</h2><input type="number" id="a2" inputmode="decimal" step="any" value="36" aria-label="Part"> is what % of <input type="number" id="b2" inputmode="decimal" step="any" value="240" aria-label="Whole"><span class="eq" id="r2"></span><small id="w2"></small></div>
  <div class="pc-row"><h2>Percentage change</h2>From <input type="number" id="a3" inputmode="decimal" step="any" value="80" aria-label="Old value"> to <input type="number" id="b3" inputmode="decimal" step="any" value="100" aria-label="New value"><span class="eq" id="r3"></span><small id="w3"></small></div>
  <div class="pc-row"><h2>Increase or decrease by a percentage</h2><input type="number" id="a4" inputmode="decimal" step="any" value="250" aria-label="Number"><select id="op4" aria-label="Increase or decrease" style="width:auto"><option value="1">increased by</option><option value="-1">decreased by</option></select><input type="number" id="b4" inputmode="decimal" step="any" value="20" aria-label="Percent"> %<span class="eq" id="r4"></span><small id="w4"></small></div>
  <div class="pc-row"><h2>Find the original number</h2><input type="number" id="a5" inputmode="decimal" step="any" value="45" aria-label="Part"> is <input type="number" id="b5" inputmode="decimal" step="any" value="30" aria-label="Percent"> % of what?<span class="eq" id="r5"></span><small id="w5"></small></div>
</div>
