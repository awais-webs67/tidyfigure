<style>
  .om { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .om-fig { background: linear-gradient(#F6F3EE, #ECE7DF); border-radius: 14px; padding: 12px; }
  .om-fig svg { width: 100%; height: auto; display: block; }
  .om-parts { display: grid; gap: 12px; }
  .om-part { display: grid; gap: 6px; }
  .om-part b { font-size: 13.5px; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
  .om-sw { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .om-sw button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .18); cursor: pointer; padding: 0; }
  .om-sw button.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .om-sw input[type=color] { width: 30px; height: 30px; padding: 0; border: 0; background: none; }
  .om-combos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .om-combos button { display: grid; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px; cursor: pointer; text-align: left; color: var(--ink); font-size: 13px; font-weight: 600; }
  .om-combos button span { display: flex; height: 18px; border-radius: 5px; overflow: hidden; }
  .om-combos button i { flex: 1; }
  @media (max-width: 640px) {
    .om { grid-template-columns: 1fr; }
    .om > div:first-child { position: sticky; top: var(--header-h); z-index: 6; background: var(--bg); padding: 6px 0; }
    .om-fig { height: 34vh; padding: 6px; display: flex; justify-content: center; }
    .om-fig svg { width: auto; height: 100%; }
    .om > div:first-child .fields { margin-top: 6px !important; gap: 6px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .om > div:first-child .f > span { font-size: 11.5px; }
  }
</style>

  </div>
</div>
