<div class="tool-grid">
  <div class="inputs">
    <div class="fields">
      <label class="f"><span>Card balance</span><input type="number" id="bal" inputmode="decimal" min="0" step="any" value="3500"></label>
      <label class="f"><span>Interest rate (APR %)</span><input type="number" id="apr" inputmode="decimal" min="0" step="any" value="24"></label>
      <label class="f"><span>Monthly payment</span><input type="number" id="pay" inputmode="decimal" min="0" step="any" value="150"></label>
    </div>
    <p class="note">Tip: compare your planned payment with the minimum payment on your statement to see how much faster you’ll be debt-free.</p>
  </div>
  <div class="out" id="out" aria-live="polite"></div>
</div>
